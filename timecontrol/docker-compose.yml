services:
  auth-svc:
    build: ./auth-svc
    ports:
      - "8001:8001"
    environment:
      - JWT_SECRET=cambia-esto-en-produccion
    volumes:
      - auth-data:/data

  clock-svc:
    build: ./clock-svc
    ports:
      - "8002:8002"
    environment:
      - JWT_SECRET=cambia-esto-en-produccion
    volumes:
      - clock-data:/data

  web:
    build: ./web
    environment:
      - PORT=80
      - AUTH_HOSTPORT=auth-svc:8001
      - CLOCK_HOSTPORT=clock-svc:8002
    ports:
      - "8000:80"
    depends_on:
      - auth-svc
      - clock-svc

volumes:
  auth-data:
  clock-data:
